title: Super Code
name: supercode
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./supercode.events::update
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
            events:
              change: ./supercode.events::onChange_vars
  - type: CollapseBox
    label: Coding Options
    collapsed: false
    children:
      - type: ListBox
        name: varOptions
        showColumnHeaders: true
        fullRowSelect: true
        stretchFactor: 1
        columns:
          - name: varName
            stretchFactor: 1
            template:
              type: VariableLabel
          - name: coding
            stretchFactor: 1
            template:
              type: ComboBox
          - name: refLevel
            stretchFactor: 1
            template:
              type: LevelSelector
          - name: standardize
            stretchFactor: 1
            template:
              type: CheckBox
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: outputCols
      - type: ActionButton
        name: runButton
