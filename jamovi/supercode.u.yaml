title: Super Code
name: supercode
jus: '3.0'
stage: 0
compilerMode: aggressive
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: ''
        children:
          - type: ListBox
            name: varOptions
            showColumnHeaders: false
            fullRowSelect: true
            stretchFactor: 1
            columns:
              - name: varName
                stretchFactor: 1
                template:
                  type: VariablesListBox
                  maxItemCount: 1
                  isTarget: true
              - name: coding
                stretchFactor: 1
                template:
                  type: ComboBox
              - name: refLevel
                stretchFactor: 1
                template:
                  type: LevelSelector
              - name: standardize
                stretchFactor: 1
                template:
                  type: CheckBox
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: outputCols
