title: Super Code
name: supercode
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./supercode.events::update
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
            events:
              change: ./supercode.events::onChange_vars
  - type: CollapseBox
    label: Coding Options
    collapsed: false
    children:
      - type: ListBox
        name: varOptions
        showColumnHeaders: true
        fullRowSelect: false
        stretchFactor: 1
        height: large
        events:
          change: ./supercode.events::onChange_varOptions
        columns:
          - name: var
            label: Variable
            stretchFactor: 1
            selectable: false
            template:
              type: VariableLabel
          - name: coding
            label: Coding
            stretchFactor: 1
            selectable: false
            template:
              type: ComboBox
              label: ''
          - name: ref
            label: Reference Level
            stretchFactor: 1
            selectable: false
            template:
              type: LevelSelector
              label: ''
              variable: var
              enable: >-
                (coding == "dummy" or coding == "simple" or coding ==
                "deviation")
          - name: standardize
            label: Std.
            stretchFactor: 0.25
            selectable: false
            template:
              type: CheckBox
              label: ''
          - name: integerize
            label: Int.
            stretchFactor: 0.25
            selectable: false
            template:
              type: CheckBox
              label: ''
              enable: >-
                (coding != "dummy" and coding != "deviation" and coding != "poly")
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: codePrefix
        label: Code Prefix
        format: string
        events:
          change: ./supercode.events::onChange_codePrefix
      - type: Output
        name: outputCols
        events:
          change: ./supercode.events::onChange_outputCols

