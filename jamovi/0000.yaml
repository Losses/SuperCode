description: >-
  An interactive jamovi module designed to generate, preview, and append coded
  columns directly to the active dataset. Supports various coding schemes
  including Dummy, Simple, Deviation, Helmert, Reverse Helmert, Forward, and
  Backward Difference coding, with options for custom reference levels and
  optional standardization. Provides a visual, transposed preview of the
  contrast matrix along with clear semantic descriptions of the mathematical
  comparisons executed by each code.
