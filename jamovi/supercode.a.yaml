---
name: supercode
title: Super Code
menuGroup: SuperCode
version: '0.0.1'
jas: '1.2'

options:
  - name: data
    type: Data

  - name: vars
    title: Variables
    type: Variables
    suggested:
      - nominal
      - ordinal
    permitted:
      - factor

  - name: varOptions
    title: ''
    type: Array
    items: (vars)
    template:
      type: Group
      elements:
        - name: var
          title: Variable
          type: Variable
          content: $key

        - name: coding
          title: Coding
          type: List
          options:
            - title: Dummy (Treatment)
              name: dummy
            - title: Simple
              name: simple
            - title: Deviation (Sum)
              name: deviation
            - title: Orthogonal Polynomial
              name: poly
            - title: Helmert
              name: helmert
            - title: Reverse Helmert
              name: revhelmert
            - title: Forward Difference
              name: forward
            - title: Backward Difference
              name: backward
          default: dummy

        - name: ref
          title: Reference Level
          type: Level
          description: >
            Used by Dummy, Simple, and Deviation.
            For Helmert/Difference codings, determines level ordering.

        - name: standardize
          title: Standardize
          type: Bool
          default: false

  - name: outputCols
    title: Add columns to dataset
    type: Output
    default: true

  - name: runButton
    title: Add Columns
    type: Action
    default: false
...

